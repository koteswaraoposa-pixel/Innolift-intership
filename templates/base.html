<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}LoanGuard AI{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="topbar">
    <div class="nav-inner">
      <a class="brand" href="/" aria-label="LoanGuard AI home">
        <span class="brand-mark">LG</span>
        <span>LoanGuard AI</span>
      </a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/predict">Predict</a></li>
        <li><a href="/predictions">Records</a></li>
        <li><a href="/about">About</a></li>

        {% if session.get('user_id') %}
          <li><a href="/logout">Logout</a></li>
        {% else %}
          <li><a href="/login">Login</a></li>
          <li><a class="button-link google" href="/auth/google">Login with Google</a></li>
          <li><a href="/register">Register</a></li>
        {% endif %}

      </ul>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p>LoanGuard AI | Flask, SQLite and ML-powered loan default prediction</p>
  </footer>
</body>
</html>
